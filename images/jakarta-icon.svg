<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D32F2F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE0B2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="16" y="16" width="224" height="224" rx="48" ry="48" fill="url(#bgGrad)"/>
  <!-- Inner shadow effect -->
  <rect x="24" y="24" width="208" height="208" rx="42" ry="42" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <!-- Monas-inspired symbol -->
  <rect x="120" y="50" width="16" height="80" rx="4" fill="url(#textGrad)" opacity="0.9"/>
  <polygon points="128,30 140,55 116,55" fill="url(#textGrad)" opacity="0.9"/>
  <circle cx="128" cy="25" r="6" fill="#FFD54F"/>
  <!-- Base platform -->
  <rect x="90" y="130" width="76" height="12" rx="3" fill="url(#textGrad)" opacity="0.8"/>
  <rect x="80" y="142" width="96" height="10" rx="3" fill="url(#textGrad)" opacity="0.7"/>
  <!-- JKT text -->
  <text x="128" y="195" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="bold" fill="url(#textGrad)" text-anchor="middle" letter-spacing="4">JKT</text>
  <!-- Decorative dots -->
  <circle cx="60" cy="70" r="4" fill="#FFD54F" opacity="0.6"/>
  <circle cx="196" cy="70" r="4" fill="#FFD54F" opacity="0.6"/>
  <circle cx="60" cy="90" r="3" fill="#FFD54F" opacity="0.4"/>
  <circle cx="196" cy="90" r="3" fill="#FFD54F" opacity="0.4"/>
</svg>